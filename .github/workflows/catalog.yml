name: FinGraph 书目与样例检查
on: [push, pull_request]
permissions:
  contents: read
jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python scripts/catalog.py --check
      - run: python scripts/survey.py --check
      - run: python scripts/verify_extended.py
      - run: python examples/node_baselines.py
      - run: python -m pip install -r pilots/elliptic/requirements.txt
      - run: python -m unittest discover -s pilots/elliptic -p 'test_*.py' -v
